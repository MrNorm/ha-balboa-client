name: Validate

# NO SCHEDULE. There was a weekly Monday cron here to catch HACS/hassfest spec
# changes, and it did exactly that: HACS made "the repository has no license" a
# hard failure, so from 2026-07-06 every Monday run failed on a repo that had not
# changed. A weekly red build nobody intends to act on is worse than no signal,
# because it sits next to the checks that do mean something. Validation still runs
# on push, on pull request, and on demand — when a change is actually being made
# and someone is there to read the result.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Brands check expects either an entry in home-assistant/brands or
          # local brand assets. Personal HACS integration, not worth it.
          ignore: brands
